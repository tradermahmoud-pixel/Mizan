<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ميزان — المبيعات والمخازن والموظفين</title>
<meta name="theme-color" content="#0A2420">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<script src="/shim.js?v=4"></script>
<script src="/vendor/barcode/polyfill.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="/vendor/JsBarcode.all.min.js"></script>
<style>
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --surface2:#F6F8F7; --ink:#13201C; --muted:#5B6B66; --line:#D9E1DE;
  --brand:#0B6E5A; --brand2:#0E8A70; --brand-soft:#DDF0EA; --gold:#C98A1E; --gold-soft:#FBF0DC;
  --danger:#B23A26; --danger-soft:#F8E3DF; --ok:#1C7F47; --ok-soft:#DFF2E6;
  --side:#0E2620; --side-ink:#DCE9E4; --side-muted:#86A39A; --side-hi:#17392F;
  --r:10px; --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif; --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0B1210; --surface:#131D1A; --surface2:#18241F; --ink:#E5EEEA; --muted:#93A59F; --line:#26352F;
  --brand:#2FB596; --brand2:#46C9A9; --brand-soft:#123A30; --gold:#E2A93F; --gold-soft:#3A2C12;
  --danger:#E7705A; --danger-soft:#3D1D17; --ok:#4CC27F; --ok-soft:#143424; --side:#070D0B; --side-hi:#12261F;
}}
:root[data-theme="dark"]{
  --bg:#0B1210; --surface:#131D1A; --surface2:#18241F; --ink:#E5EEEA; --muted:#93A59F; --line:#26352F;
  --brand:#2FB596; --brand2:#46C9A9; --brand-soft:#123A30; --gold:#E2A93F; --gold-soft:#3A2C12;
  --danger:#E7705A; --danger-soft:#3D1D17; --ok:#4CC27F; --ok-soft:#143424; --side:#070D0B; --side-hi:#12261F;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num,td.n,input.n{font-variant-numeric:tabular-nums}
#app{display:grid;grid-template-columns:248px 1fr;height:100%}
#side{background:var(--side);color:var(--side-ink);overflow-y:auto;padding:18px 12px 24px;position:relative}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.brand .mark{width:38px;height:38px;border-radius:9px;background:var(--brand);display:grid;place-items:center}
.brand b{font:700 26px/1 var(--display);letter-spacing:0}
.brand small{display:block;color:var(--side-muted);font-size:12px;margin-top:4px}
.navg{margin-top:14px}
.navg h6{margin:0 10px 6px;font-size:12px;font-weight:500;color:var(--side-muted)}
.navg a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--side-ink);text-decoration:none;font-size:14.5px}
.navg a svg{width:19px;height:19px;flex:none;opacity:.85}
.navg a:hover{background:var(--side-hi)}
.navg a.on{background:var(--brand);color:#fff}
.navg a.on svg{opacity:1}
#main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
#top{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
#top h1{margin:0;font:700 21px/1.3 var(--display);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--gold)}
.sync.cloud i{background:var(--ok)}
#view{flex:1;overflow-y:auto;padding:22px 24px 40px}
#menuBtn{display:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:39;display:none}
#bottom{display:none}
.wrap{max-width:1280px;margin:0 auto}

/* primitives */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--brand)}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.p:hover{background:var(--brand2)}
.btn.g{background:var(--gold);border-color:var(--gold);color:#1d1406}
.btn.d{color:var(--danger);border-color:var(--danger-soft)}
.btn.d:hover{background:var(--danger-soft)}
.btn.s{padding:4px 10px;font-size:13px}
.btn.ic{padding:6px;width:34px;height:34px}
.btn svg{width:17px;height:17px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h3{margin:0 0 12px;font:600 16px/1.4 var(--font)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.gat{grid-template-columns:minmax(0,380px) minmax(0,1fr);align-items:start}
.muted{color:var(--muted)}
.small{font-size:13px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:14.5px;min-width:0}
.in:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.tag{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.sale{background:var(--brand-soft);color:var(--brand)}
.tag.purchase{background:var(--gold-soft);color:var(--gold)}
.tag.sret,.tag.pret,.tag.bad{background:var(--danger-soft);color:var(--danger)}
.tag.ok,.tag.open{background:var(--ok-soft);color:var(--ok)}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{background:var(--surface2);text-align:right;font-weight:600;font-size:12.5px;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t tbody tr:hover td{background:var(--surface2)}
table.t td.n,table.t th.n{text-align:left;white-space:nowrap}
table.t tfoot td{font-weight:700;background:var(--surface2);border-top:1px solid var(--line)}
table.t tr.click{cursor:pointer}
/* editable spreadsheet cells */
.cell{width:100%;min-width:70px;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 7px;font-variant-numeric:tabular-nums;color:var(--ink)}
.cell:hover{border-color:var(--line);background:var(--surface)}
.cell:focus{border-color:var(--brand);background:var(--surface);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.cell.auto{color:var(--muted)}
.cell.man{color:var(--gold);font-weight:600}
.cell.flash{animation:fl 1.1s ease}
@keyframes fl{0%{background:var(--ok-soft)}100%{background:transparent}}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.neg{color:var(--danger)}
.pos{color:var(--ok)}

/* dashboard */
.strip{display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.strip>div{padding:18px 20px;border-inline-start:1px solid var(--line)}
.strip>div:first-child{border-inline-start:0;background:var(--side);color:var(--side-ink)}
.strip .k{font-size:13px;color:var(--muted)}
.strip>div:first-child .k{color:var(--side-muted)}
.strip .v{font:700 30px/1.25 var(--display);margin-top:4px;font-variant-numeric:tabular-nums}
.strip>div:first-child .v{font-size:40px;color:#fff}
.strip .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.strip>div:first-child .s{color:var(--side-muted)}
.bars{display:flex;align-items:flex-end;gap:6px;height:170px;padding-top:10px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.bars .col{width:100%;max-width:34px;border-radius:5px 5px 2px 2px;background:var(--brand);position:relative;min-height:2px}
.bars .col i{position:absolute;inset:auto 0 0 0;background:var(--gold);border-radius:2px;min-height:0}
.bars small{font-size:11px;color:var(--muted)}
.steps{counter-reset:s;display:grid;gap:10px;margin:14px 0}
.steps div{display:flex;gap:12px;align-items:center}
.steps div::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);font-weight:700;flex:none}

/* invoice editor */
.edhead{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.psearch{position:relative;margin:16px 0 12px}
.psearch .in{padding:12px 44px 12px 14px;font-size:16px;border-width:2px}
.psearch svg{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.sugg{position:absolute;top:100%;inset-inline:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:4px;z-index:20;box-shadow:0 12px 30px rgba(0,0,0,.14);overflow:hidden}
.sugg button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;padding:9px 14px;text-align:right;cursor:pointer;border-bottom:1px solid var(--line)}
.sugg button:last-child{border:0}
.sugg button:hover,.sugg button.on{background:var(--brand-soft)}
.totals{display:grid;grid-template-columns:1fr 340px;gap:16px;margin-top:16px;align-items:start}
.tbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tbox .l{display:flex;justify-content:space-between;align-items:center;padding:5px 0;gap:10px}
.tbox .l .in{width:120px;text-align:left}
.tbox .grand{border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;font:700 24px/1.2 var(--display)}
.dk{cursor:pointer;transition:background .15s,transform .1s}.strip>.dk:hover{background:color-mix(in srgb,var(--brand) 8%,transparent)}.row.dk:hover{background:var(--surface2)}.bars .b.dk:hover .col{filter:brightness(1.15)}.dk:active{transform:scale(.99)}
.stickybar{position:sticky;bottom:-40px;background:var(--bg);padding:12px 0;margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line)}

/* attendance */
.punch{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.punch button{border:0;border-radius:14px;padding:22px 10px;font:700 22px/1.2 var(--display);cursor:pointer;color:#fff}
.punch .pi{background:var(--brand)}
.punch .po{background:var(--side)}
.punch button:disabled{opacity:.35;cursor:not-allowed}
.clock{font:700 46px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:1px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:6px;vertical-align:middle}

/* import */
.drop{border:2px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;background:var(--surface);cursor:pointer;transition:border-color .15s}
.drop.over,.drop:hover{border-color:var(--brand);background:var(--brand-soft)}
.drop b{display:block;font:700 20px/1.4 var(--display);margin-bottom:4px}
.maprow{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}

/* modal / toast */
#modal{position:fixed;inset:0;background:rgba(5,15,12,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:5vh 14px;overflow-y:auto}
#modal.on{display:flex}
.mbox{background:var(--surface);border-radius:14px;width:100%;max-width:640px;padding:20px 22px;box-shadow:0 30px 70px rgba(0,0,0,.3)}
.mbox.w{max-width:960px}
.mbox h2{margin:0 0 14px;font:700 20px/1.3 var(--display)}
#toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:ti .2s ease}
#toast div.err{background:var(--danger);color:#fff}
@keyframes ti{from{opacity:0;transform:translateY(8px)}}
.progress{height:8px;background:var(--surface2);border-radius:5px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);transition:width .2s}
#print{display:none}
.lab{box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#fff;color:#000;border:1px dashed #bbb;padding:1mm 1.5mm;font-family:var(--font);line-height:1.15}
.lab .ln{font-weight:700;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lab svg{max-width:100%;display:block}
.lab .lp{font-weight:700}
.lab .lc{font-size:7pt;color:#333}
.sheet{display:grid;gap:0;background:#fff}
.preview{background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-wrap:wrap;gap:8px;max-height:60vh;overflow:auto;justify-content:flex-start}
.due{font-size:12px;font-weight:600}

@media (max-width:1100px){.strip{grid-template-columns:1fr 1fr}.strip>div:nth-child(3){border-inline-start:0}.strip>div{border-top:1px solid var(--line)}.strip>div:first-child{grid-column:1/-1;border-top:0}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  #app{grid-template-columns:1fr}
  #side{position:fixed;inset:0 0 0 auto;width:min(300px,86vw);z-index:40;transform:translateX(100%);transition:transform .22s ease;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  #app.drawer #side{transform:none;box-shadow:-20px 0 50px rgba(0,0,0,.35)}
  #app.drawer #scrim{display:block}
  #menuBtn{display:inline-flex}
  #top{padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
  #top h1{font-size:18px}
  #view{padding:14px 12px calc(90px + env(safe-area-inset-bottom,0px))}
  #bottom{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom,0px)}
  #bottom a,#bottom button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;font-size:11.5px;color:var(--muted);text-decoration:none;border:0;background:none;cursor:pointer}
  #bottom svg{width:22px;height:22px}
  #bottom .on{color:var(--brand);font-weight:600}
  #bottom .sale{color:#fff}
  #bottom .sale span.ic{background:var(--brand);border-radius:12px;padding:6px 14px;margin-top:-4px}
  .g2,.g3,.g4,.g21,.gat{grid-template-columns:1fr}
  .totals{grid-template-columns:1fr}
  .strip .v{font-size:24px}.strip>div:first-child .v{font-size:32px}
  .stickybar{position:static;margin-bottom:0;box-shadow:none;padding:12px 0;gap:8px}
  .stickybar>.btn,.stickybar>a.btn{flex:1 1 calc(50% - 8px);justify-content:center}
  body.kb-open #bottom,body.kb-open #aiFab{display:none}
  .sync span{display:none}
  .hide-m{display:none}
}
@media print{
  body *{visibility:hidden}
  #print,#print *{visibility:visible}
  body>*:not(#print){display:none!important}html,body{height:auto!important;overflow:visible!important;background:#fff!important}
  #print{display:block;position:static;padding:20px;color:#000;background:#fff;font-size:13px}
  #print.lbl{padding:0}
  #print.lbl .lab{border:0}
  #print table{width:100%;border-collapse:collapse}#print th,#print td{border:1px solid #999;padding:5px;text-align:right}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

#wsT tr.ws-on td{background:color-mix(in srgb,var(--brand) 22%,var(--surface))!important;font-weight:600;box-shadow:inset 0 1px 0 var(--brand),inset 0 -1px 0 var(--brand)}#wsT tr.ws-on td:first-child{box-shadow:inset -4px 0 0 var(--brand),inset 0 1px 0 var(--brand),inset 0 -1px 0 var(--brand)}
#wsT tr.ws-added td{color:var(--brand)}
.kbhelp{display:flex;flex-wrap:wrap;gap:4px 14px}.kbg{white-space:nowrap}
.kbhelp kbd,kbd{display:inline-block;min-width:18px;padding:1px 6px;margin:0 1px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--surface);font:600 11.5px/1.5 ui-monospace,monospace;color:var(--ink);text-align:center}

#lt tr.trk-hit td{background:color-mix(in srgb,var(--gold,#c49a4c) 26%,var(--surface))!important;animation:trkf 1.6s ease 2}
#lt tr.trk-hit td:first-child{box-shadow:inset -4px 0 0 var(--gold,#c49a4c)}
@keyframes trkf{0%,100%{filter:none}50%{filter:brightness(1.12)}}
.trk-back{margin-bottom:10px}
</style>

<body>
<div id="app">
  <aside id="side" aria-label="القائمة"></aside>
  <div id="scrim"></div>
  <div id="main">
    <header id="top">
      <button class="btn ic" id="menuBtn" aria-label="فتح القائمة"></button>
      <button class="btn ic" id="backBtn" aria-label="رجوع" title="رجوع (Alt + ←  أو  Backspace)" hidden style="font-size:20px;line-height:1">→</button>
      <h1 id="title">ميزان</h1>
      <a class="pqpill" id="pqPill" href="#/" hidden></a><span class="sync" id="sync"><i></i><span>جارٍ الاتصال…</span></span>
    </header>
    <div id="view"></div>
  </div>
  <nav id="bottom"></nav>
</div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" aria-live="polite"></div>
<div id="print"></div>

<script>
/* ============ utilities ============ */
const COLL=new Intl.Collator('ar',{numeric:true,sensitivity:'base'});
String.prototype.localeCompare=function(b){return COLL.compare(String(this),String(b??''))};
const scmp=(a,b)=>a<b?-1:a>b?1:0;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>{n=+n||0;return (Math.round(n*100)/100).toLocaleString('en-US',{maximumFractionDigits:2})};
const fq=n=>{n=+n||0;return (Math.round(n*1000)/1000).toLocaleString('en-US',{maximumFractionDigits:3})};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const nowD=()=>new Date(Date.now()+((window.MZ&&MZ.skew)||0));
const BIZ_TZ='Africa/Cairo';
const today=()=>{try{return new Intl.DateTimeFormat('en-CA',{timeZone:BIZ_TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(nowD())}catch(e){return ds(nowD())}};
const dateEditOK=()=>!!(typeof settings==='function'&&settings().allowDateEdit);

async function flushChunk(key){while(PEND[key]){const p=PEND[key];delete PEND[key];try{await writeChunk(p.c,p.b,p.items,p.full);p.w.forEach(x=>x[0]())}catch(e){p.w.forEach(x=>x[1](e))}}FL[key]=0}
async function writeChunk(c,b,items,full){const ref=S.db.collection('x_'+c).doc(b);
  try{await ref.update({items,u:Date.now()})}catch(e){
    if(e&&e.code==='invalid_argument'){let ex=true;try{ex=(await ref.get()).exists}catch(_){}
      if(!ex){const cl={};for(const k in full)if(full[k])cl[k]=full[k];await ref.set({items:cl,u:Date.now()});return}throw e}
    await new Promise(r=>setTimeout(r,600+Math.random()*600));await ref.update({items,u:Date.now()})}}
async function put(c,id,obj){
  obj=clone(obj);const prev=S.data[c].get(id);S.data[c].set(id,obj);bump(c);schedule();
  if(S.mode==='cloud'&&CHUNKED[c]){const pay=clone(obj);if(prev)for(const k in prev)if(!(k in obj))pay[k]=null;try{await chunkWrite(c,id,pay,obj)}catch(e){dbErr(e);throw e}return}
  if(S.mode==='cloud'){try{await S.db.collection(c).doc(id).set(obj)}catch(e){try{await new Promise(r=>setTimeout(r,500+Math.random()*500));await S.db.collection(c).doc(id).set(obj)}catch(e2){dbErr(e2);throw e2}}}
  else saveLocal(c);
}
async function del(c,id){
  S.data[c].delete(id);bump(c);schedule();
  if(S.mode==='cloud'&&CHUNKED[c]){try{await chunkWrite(c,id,null,null)}catch(e){dbErr(e);throw e}return}
  if(S.mode==='cloud'){try{await S.db.collection(c).doc(id).delete()}catch(e){dbErr(e);throw e}}
  else saveLocal(c);
}
async function putMany(items,onp){
  if(S.mode==='cloud'){let done=0;await Promise.all(items.map(it=>put(it[0],it[1],it[2]).then(()=>{done++;onp&&onp(done,items.length)})));return}let i=0,done=0;const N=items.length;
  async function worker(){while(i<N){const it=items[i++];await put(it[0],it[1],it[2]);done++;onp&&onp(done,N)}}
  await Promise.all([worker(),worker(),worker(),worker()]);
}

let CC=null;
function invTotals(inv){
  let sub=0;(inv.lines||[]).forEach(l=>{sub+=(+l.qty||0)*(+l.price||0)*(1-(+l.disc||0)/100)});
  const after=sub-(+inv.discount||0);const tax=after*(+inv.taxRate||0)/100;const total=after+tax;

  const st=id=>R.stock[id]||(R.stock[id]={qty:0,value:0,by:{},last:+(P.get(id)?.cost)||0,in:0,out:0});
  for(const [id] of P)st(id);
  const invs=L('invoices').sort((a,b)=>scmp(a.date||'',b.date||'')||scmp(a.createdAt||'',b.createdAt||''));
  for(const inv of invs){
    if(TYPES[inv.type]?.doc)continue;
    const t=invTotals(inv);let cogs=0,adjv=0,ival=0;const store=inv.storeId||MAIN;
    (inv.lines||[]).forEach((l,i)=>{

        case 'sret':cost=man?+l.cost:avg;s.qty+=q;s.value+=q*cost;add(store,q);s.in+=q;profit=-(net-q*cost);cogs-=q*cost;break;
        case 'pret':s.qty-=q;s.value-=q*avg;add(store,-q);s.out+=q;break;

        case 'count':book=s.by[store]||0;cdiff=q-book;s.by[store]=q;s.qty+=cdiff;s.value+=cdiff*avg;cost=avg;if(cdiff>0)s.in+=cdiff;else s.out+=-cdiff;adjv+=cdiff*avg;break;

      const d=R.daily[inv.date]||(R.daily[inv.date]={sales:0,profit:0,count:0});
      const sg=inv.type==='sale'?1:-1;d.sales+=sg*t.total;d.profit+=profit;if(sg>0)d.count++;

function tafqeet(n){

  const scale=(x,one,two,few,many)=>{if(!x)return '';if(x===1)return one;if(x===2)return two;if(x<=10)return u999(x)+' '+few;return u999(x)+' '+many};

function pickPending(){return L('invoices').filter(i=>['sale','transfer'].includes(i.type)&&(!window.MZ_FLOW||!MZ_FLOW.inFlow||MZ_FLOW.inFlow(i))&&!(prn(i.id)&&prn(i.id).prepAt)&&!(G('picks',i.id)&&G('picks',i.id).status==='ok'))}
const PL_={detail:true,sort:'name'};
function pickAgg(ids){const m=new Map();const invs=ids.map(id=>G('invoices',id)).filter(Boolean);
  for(const i of invs)for(const l of i.lines||[]){if(!l.pid)continue;const q=+l.qty||0;if(!q)continue;const x=m.get(l.pid)||{pid:l.pid,qty:0,by:new Map(),n:0};x.qty+=q;x.n++;const k=i.type==='transfer'?'تحويل '+storeName(i.toStoreId):(partyName(i.partyId)||'نقدي');x.by.set(k,(x.by.get(k)||0)+q);m.set(l.pid,x)}
  const rows=[...m.values()];const P=id=>G('products',id)||{};
  rows.sort((a,b)=>PL_.sort==='qty'?b.qty-a.qty:PL_.sort==='code'?(+P(a.pid).code||0)-(+P(b.pid).code||0):PL_.sort==='group'?String(P(a.pid).group||'').localeCompare(String(P(b.pid).group||''),'ar')||pname(a.pid).localeCompare(pname(b.pid),'ar'):pname(a.pid).localeCompare(pname(b.pid),'ar'));
  return {invs,rows,parties:new Set(invs.map(i=>i.partyId||'_')).size}}
function pendQty(){const m={};for(const i of pickPending())if(i.type==='sale'&&(i.storeId||MAIN)===MAIN)for(const l of i.lines||[])if(l.pid)m[l.pid]=(m[l.pid]||0)+(+l.qty||0);return m}

   <p class="small" style="margin:4px 0 8px"><b>${invs.length}</b> فاتورة · <b>${parties}</b> عميل · <b>${rows.length}</b> صنف · إجمالي <b>${fq(tq)}</b> قطعة — الفواتير: ${invs.map(i=>'#'+esc(i.no)+(i.date!==today()?' <span class="muted">('+esc(i.date.slice(5).split('-').reverse().join('/'))+')</span>':'')).join(' ')}</p>
   <table class="t"><thead><tr><th style="width:28px">م</th><th style="width:60px">الكود</th><th>الصنف</th><th class="n" style="width:70px">الإجمالي</th><th class="n" style="width:55px">فواتير</th>${forPrint?'':'<th class="n" style="width:70px" title="الرصيد قبل خصم الفواتير اللي لسه ماتحضرتش">على الرف</th>'}${PL_.detail?'<th>العملاء</th>':''}${forPrint?'<th style="width:40px">✓</th>':''}</tr></thead><tbody>
   ${rows.map((r,k)=>{const p=G('products',r.pid)||{};const av=qtyIn(r.pid,st)+(pq[r.pid]||0);return `<tr><td>${k+1}</td><td class="num">${esc(p.code||'')}</td><td><b>${esc(pname(r.pid))}</b>${p.barcode&&!forPrint?`<div class="small muted num">${esc(p.barcode)}</div>`:''}</td><td class="n num" style="font-size:${forPrint?'15px':'16px'}"><b>${fq(r.qty)}</b></td><td class="n">${r.n}</td>${forPrint?'':`<td class="n num ${av<r.qty?'neg':''}" title="${av<r.qty?'اللي على الرف أقل من المطلوب':''}">${fq(av)}</td>`}${PL_.detail?`<td class="small">${[...r.by].sort((a,b)=>b[1]-a[1]).map(([n,q])=>esc(n)+' <b class="num">'+fq(q)+'</b>').join(' · ')}</td>`:''}${forPrint?'<td></td>':''}</tr>`}).join('')}</tbody></table>`}

  draw()}

function readFile(f){

  const r=new FileReader();r.onload=()=>{try{
    const wb=XLSX.read(new Uint8Array(r.result),{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true}).filter(r=>r.some(c=>String(c).trim()!==''));
    if(aoa.length<2){toast('الشيت فاضي أو مفيهوش غير صف العناوين','err');return}
    let hr=0;for(let i=0;i<Math.min(6,aoa.length);i++){const m=autoMap(aoa[i].map(String));if(m.name!=null){hr=i;break}}
    IMP.headers=aoa[hr].map(h=>String(h).trim());IMP.rows=aoa.slice(hr+1);IMP.map=autoMap(IMP.headers);IMP.file=f.name;IMP.busy=false;

}

function dayStatus(e,a,date){
  const off=(e.offDays||[]).includes(new Date(date+'T12:00:00').getDay());
  if(!a||!a.in)return {k:off?'off':'abs',t:off?'إجازة':'لم يحضر',late:0,ot:0,work:0};
  const s=toMin(e.shiftStart),en=toMin(e.shiftEnd),i=toMin(a.in),o=toMin(a.out);
  const late=s!=null&&!off?Math.max(0,i-(s+(+e.grace||0))):0;const ot=o!=null&&en!=null?Math.max(0,o-en)+(off&&o!=null?Math.max(0,o-i)-Math.max(0,o-en):0):0;
  const work=o!=null?Math.max(0,o-i):0;
  return {k:a.out?'left':'in',t:a.out?'انصرف':'حاضر',late:Math.round(late),ot:Math.round(ot),work};
}

function payroll(e,ym){

  let pres=0,abs=0,late=0,ot=0;for(let d=1;d<=nd;d++){const date=`${ym}-${pad(d)}`;if(date>t)break;const a=G('attendance',e.id+'_'+date);const s=dayStatus(e,a,date);if(a?.in){pres++;late+=s.late;ot+=s.ot}else if(s.k==='abs'&&date<t)abs++}
  const sal=+e.salary||0;const day=sal/30;const shift=Math.max(60,(toMin(e.shiftEnd)??0)-(toMin(e.shiftStart)??0))||480;const mr=day/shift;
  const dAbs=abs*day,dLate=late*mr,addOt=ot*mr*1.5;

}

function saleLines(opt={}){
  const R=calc();const out=[];
  for(const inv of L('invoices')){
    if(inv.type!=='sale'&&inv.type!=='sret')continue;if(!opt.all&&!inRange(inv.date||''))continue;
    if(RF.store&&(inv.storeId||MAIN)!==RF.store)continue;if(!opt.noParty&&RF.customer&&inv.partyId!==RF.customer)continue;if(RF.emp&&inv.empId!==RF.emp)continue;
    const t=R.inv[inv.id];const f=t&&t.sub?t.after/t.sub:1;const sg=inv.type==='sale'?1:-1;
    (inv.lines||[]).forEach((l,i)=>{const x=R.line[inv.id+':'+i];if(!x)return;const p=G('products',l.pid);if(RF.group&&(p?.group||'')!==RF.group)return;
      const q=sg*(+l.qty||0);const net=sg*x.net*f;const cost=q*x.cost;out.push({inv,l,p,pid:l.pid,sg,q,net,cost,profit:net-cost})});
  }

}
function buyLines(opt={}){

    const t=R.inv[inv.id];const f=t&&t.sub?t.after/t.sub:1;const sg=inv.type==='purchase'?1:-1;
    (inv.lines||[]).forEach((l,i)=>{const x=R.line[inv.id+':'+i];if(!x)return;const p=G('products',l.pid);if(RF.group&&(p?.group||'')!==RF.group)return;
      const q=+l.qty||0;out.push({inv,l,p,pid:l.pid,sg,q:sg*q,val:sg*x.net*f,unit:q?x.net*f/q:0})});

function aging(pid,bal,kind){

  const invs=L('invoices').filter(i=>i.partyId===pid&&i.type===(kind==='customer'?'sale':'purchase')).sort((a,c)=>(c.date||'').localeCompare(a.date||''));
  for(const inv of invs){if(rem<=0.009)break;const tt=invTotals(inv);const take=Math.min(rem,tt.total);rem-=take;const age=daysBetween(inv.date,t);
    if(age<=30)b.a0+=take;else if(age<=60)b.a30+=take;else if(age<=90)b.a60+=take;else b.a90+=take}
  b.a90+=Math.max(0,rem);return b;
}

  {const de=$('#dEdit');if(de)de.onchange=async()=>{await put('settings','main',{...settings(),allowDateEdit:de.checked});await audit('settings','main','تعديل التاريخ',de.checked?'مقفول':'مسموح',de.checked?'مسموح':'مقفول','الإعدادات');toast(de.checked?'تعديل التاريخ بقى مسموح':'التاريخ بقى تلقائي ومقفول')}}
  {const fs=$('#flS');if(fs)fs.onchange=async()=>{await put('settings','main',{...settings(),flowLoose:!fs.checked});toast(fs.checked?'التسلسل الإجباري اتفعّل':'التسلسل بقى اختياري')}}
  {const po=$('#pOnly');if(po)po.onchange=async()=>{await put('settings','main',{...settings(),printOnlyPrep:po.checked});toast(po.checked?'الطباعة بقت من شاشة التحضير بس':'السيلز يقدر يطبع تاني')}}
  {const ng=$('#negA');if(ng)ng.onchange=async()=>{const v=ng.checked;await put('settings','main',{...settings(),allowNegative:v});await audit('settings','main','البيع بدون رصيد',v?'ممنوع':'مسموح',v?'مسموح':'ممنوع','الإعدادات');toast(v?'تم السماح بالبيع بالسالب':'تم منع البيع بدون رصيد')}}

}

/* ============ AUDIT ============ */
function vAudit(){

  $('#view').innerHTML=`<div class="wrap"><p class="muted" style="margin:0 0 12px">كل تعديل على فاتورة أو سعر أو حضور أو سند بيتسجل هنا: مين عدّل، إمتى، والقيمة قبل وبعد.</p>
   ${list.length?`<div class="tw"><table class="t"><thead><tr><th>الوقت</th><th>المستخدم</th><th>المستند</th><th>الحقل</th><th>قبل</th><th>بعد</th></tr></thead><tbody>
   ${list.map(a=>`<tr ${a.entity==='invoice'&&G('invoices',a.entityId)?`class="click" data-go="${a.entityId}"`:''}><td class="num small">${(a.at||'').slice(0,16).replace('T',' ')}</td><td>${esc(whoName(a.who)||'—')}</td><td>${esc(a.label||'')}</td><td>${esc(a.field)}</td><td class="neg">${esc(a.old)}</td><td class="pos">${esc(a.new)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty card"><b>لا توجد تعديلات بعد</b>عدّل أي فاتورة أو خلية في شبكة الحركات وهتلاقي التعديل هنا.</div>`}</div>`;

let DM={k:null,m:{}};
function demand(days){const k=calcKey()+'|'+days;if(DM.k===k)return DM.m;const from=addDays(today(),-days);const m={};
  for(const i of L('invoices')){if((i.date||'')<from)continue;const sg=i.type==='sale'?1:i.type==='sret'?-1:0;if(!sg)continue;(i.lines||[]).forEach(l=>{m[l.pid]=(m[l.pid]||0)+sg*(+l.qty||0)})}DM={k,m};return m}
function lastBuy(pid){const mv=calc().pmove[pid]||[];for(let k=mv.length-1;k>=0;k--){if(mv[k].inv.type==='purchase')return mv[k]}return null}

function shortages(o={}){const days=Math.max(1,+(o.days||SH.days)),cover=Math.max(1,+(o.cover||SH.cover));const dm=demand(days);const out=[];
  for(const p of L('products')){if(p.inactive)continue;const sold=dm[p.id]||0;if(sold<=0)continue;const q=qtyIn(p.id),min=+p.minQty||0,daily=sold/days;
    if(!((min>0&&q<=min)||q<daily*7))continue;const need=Math.ceil(Math.max(min*2,daily*cover)-q);if(need<=0)continue;
    const lb=lastBuy(p.id);const v=lb?lb.inv.partyId||'':'';if(o.vendor!=null&&o.vendor!==''&&(o.vendor==='_'?v!=='':v!==o.vendor))continue;
    out.push({p,q,min,sold,daily,sug:need,vendor:v,lp:lb?lb.unit:(+p.cost||avgCost(p.id))})}
  return out.sort((a,b)=>(a.q/(a.daily||1))-(b.q/(b.daily||1)))}

  if(!(await confirmBox(msg,'تأكيد',act==='bounced')))return;

  await audit('cheque',id,'الحالة',CHS[c.status||'pending'][0],CHS[act][0],lb);await put('cheques',id,n);toast('تم: '+CHS[act][0]);
}

/* ============ BARCODE LABELS ============ */
const LSIZES={'38x25':{t:'ملصق حراري 38×25 مم',w:38,h:25},'50x25':{t:'ملصق حراري 50×25 مم',w:50,h:25},'58x40':{t:'ملصق حراري 58×40 مم',w:58,h:40},'a4-65':{t:'ورق A4 — 65 ملصق (5×13)',w:38.1,h:21.2,cols:5,rows:13,a4:true},'a4-24':{t:'ورق A4 — 24 ملصق (3×8)',w:70,h:37,cols:3,rows:8,a4:true}};
let BC={sel:{},size:'38x25',name:true,price:true,code:false,q:''};
const eanOk=v=>{if(!/^\d{13}$/.test(v))return false;let s=0;for(let i=0;i<12;i++)s+=(+v[i])*(i%2?3:1);return (10-s%10)%10===+v[12]};
const eanMake=base12=>{let s=0;for(let i=0;i<12;i++)s+=(+base12[i])*(i%2?3:1);return base12+((10-s%10)%10)};
function bcValue(p){return String(p.barcode||p.code||'').trim()}
function drawBarcodes(root,sz){
  $$('svg[data-bc]',root).forEach(svg=>{const v=svg.dataset.bc;if(!window.JsBarcode||!v){svg.outerHTML=`<div class="lc">${esc(v)}</div>`;return}
    try{JsBarcode(svg,v,{format:eanOk(v)?'EAN13':'CODE128',width:sz.w>45?1.6:1.2,height:Math.max(18,sz.h*1.6),displayValue:true,fontSize:11,margin:0,textMargin:1,flat:true})}catch(e){svg.outerHTML=`<div class="lc">${esc(v)}</div>`}});
}
function labelHTML(p,sz){
  const fs=Math.max(6,Math.min(10,sz.h/3.2));
  return `<div class="lab" style="width:${sz.w}mm;height:${sz.h}mm;font-size:${fs}pt">${BC.name?`<div class="ln">${esc(p.name)}</div>`:''}<svg data-bc="${esc(bcValue(p))}" style="height:${sz.h*(BC.name&&BC.price?0.48:0.62)}mm"></svg>${BC.price?`<div class="lp">${fmt(p.price)} ${esc(settings().currency||'ج.م')}</div>`:''}${BC.code&&p.code?`<div class="lc">كود ${esc(p.code)}</div>`:''}</div>`;
}
function bcLabels(){const out=[];for(const [pid,n] of Object.entries(BC.sel)){const p=G('products',pid);if(!p)continue;for(let i=0;i<Math.min(+n||0,1000);i++)out.push(p)}return out}
function vBarcode(){
  setTitle('طباعة الباركود');const sz=LSIZES[BC.size];
  let list=L('products');if(BC.q)list=pSearch(BC.q);
  list.sort((a,b)=>String(a.code||'').localeCompare(String(b.code||''),undefined,{numeric:true}));
  const labs=bcLabels();const noBar=L('products').filter(p=>!p.barcode).length;
  $('#view').innerHTML=`<div class="wrap"><div class="grid g2" style="align-items:start">
   <div class="card"><div class="row" style="margin-bottom:10px"><h3 style="margin:0">اختر الأصناف وعدد الملصقات</h3><span class="sp"></span><button class="btn s" id="bAll">كل الأصناف = الرصيد</button><button class="btn s" id="bClr">مسح</button></div>
     <input class="in" id="bq" placeholder="بحث بالاسم / الكود / الباركود" value="${esc(BC.q)}" style="margin-bottom:10px">
     <div class="tw" style="max-height:52vh;overflow:auto"><table class="t" id="bt"><thead><tr><th>الصنف</th><th>الباركود</th><th class="n">الرصيد</th><th>عدد الملصقات</th></tr></thead><tbody>
     ${list.slice(0,400).map(p=>`<tr><td><b>${esc(p.name)}</b><div class="small muted">${esc(p.code||'')} · ${fmt(p.price)}</div></td><td class="num small">${p.barcode?esc(p.barcode):'<span class="tag bad">بدون</span>'}</td><td class="n">${fq(qtyIn(p.id))}</td><td><input class="cell n" style="min-width:64px" inputmode="numeric" data-bp="${p.id}" value="${BC.sel[p.id]||''}" placeholder="0"></td></tr>`).join('')||'<tr><td colspan="4" class="muted">لا توجد أصناف</td></tr>'}</tbody></table></div>
     ${noBar?`<div class="row" style="margin-top:12px"><span class="small muted" style="flex:1">${noBar} صنف بدون باركود — ممكن أولّد لهم باركود داخلي EAN-13 يبدأ بـ 2 (مخصص للاستخدام داخل المحل).</span><button class="btn s" id="bGen" ${S.ro?'disabled':''}>توليد باركود</button></div>`:''}</div>
   <div class="card"><h3>شكل الملصق</h3>
     <label class="f">المقاس<select class="in" id="bs">${opts(Object.entries(LSIZES).map(([k,v])=>[k,v.t]),BC.size)}</select></label>
     <div class="row" style="margin:12px 0;gap:16px"><label class="row small" style="gap:6px"><input type="checkbox" id="bn" ${BC.name?'checked':''}>اسم الصنف</label><label class="row small" style="gap:6px"><input type="checkbox" id="bpr" ${BC.price?'checked':''}>السعر</label><label class="row small" style="gap:6px"><input type="checkbox" id="bco" ${BC.code?'checked':''}>الكود</label></div>
     <div class="preview" id="bprev">${labs.length?labs.slice(0,24).map(p=>labelHTML(p,sz)).join(''):'<p class="muted small" style="margin:auto">اكتب عدد الملصقات قدام الأصناف لتظهر المعاينة هنا.</p>'}</div>
     <div class="row" style="margin-top:12px"><button class="btn p" id="bPrint" ${labs.length?'':'disabled'}>${ic('print')}طباعة ${labs.length} ملصق</button>${labs.length>24?`<span class="small muted">المعاينة لأول 24 ملصق</span>`:''}</div>
     <p class="small muted">للطابعات الحرارية (Zebra / Xprinter) اختر المقاس المطابق للرول، وفي نافذة الطباعة خلّي الهوامش "بدون" والمقياس 100%.</p></div></div></div>`;
  drawBarcodes($('#bprev'),sz);
  $('#bt').addEventListener('change',e=>{const el=e.target;if(!el.dataset.bp)return;const n=Math.max(0,Math.floor(numIn(el.value)));if(n)BC.sel[el.dataset.bp]=n;else delete BC.sel[el.dataset.bp];render()});
  $('#bq').onchange=e=>{BC.q=e.target.value.trim();render()};
  $('#bAll').onclick=()=>{L('products').forEach(p=>{const q=Math.floor(qtyIn(p.id));if(q>0)BC.sel[p.id]=q});render()};
  $('#bClr').onclick=()=>{BC.sel={};render()};
  $('#bs').onchange=e=>{BC.size=e.target.value;render()};$('#bn').onchange=e=>{BC.name=e.target.checked;render()};$('#bpr').onchange=e=>{BC.price=e.target.checked;render()};$('#bco').onchange=e=>{BC.code=e.target.checked;render()};
  const g=$('#bGen');if(g)g.onclick=async()=>{const ps=L('products').filter(p=>!p.barcode);if(!(await confirmBox(`توليد باركود داخلي لـ ${ps.length} صنف؟`,'توليد')))return;
    const used=new Set(L('products').map(p=>String(p.barcode||'')));let seq=1;const items=[];
    for(const p of ps){let v;do{v=eanMake('2'+String(Date.now()%1e5).padStart(5,'0').slice(0,5)+String(seq++).padStart(6,'0'))}while(used.has(v));used.add(v);const n={...G('products',p.id),barcode:v};items.push(['products',p.id,n])}
    await putMany(items);toast(`تم توليد ${items.length} باركود`)};
  $('#bPrint').onclick=()=>{
    const pr=$('#print');pr.className='lbl';
    if(sz.a4){const per=sz.cols*sz.rows;const pages=[];for(let i=0;i<labs.length;i+=per)pages.push(labs.slice(i,i+per));
      pr.innerHTML=`<style>@page{size:A4;margin:10mm 4mm}</style>`+pages.map(pg=>`<div class="sheet" style="grid-template-columns:repeat(${sz.cols},${sz.w}mm);page-break-after:always;justify-content:center">${pg.map(p=>labelHTML(p,sz)).join('')}</div>`).join('')}
    else pr.innerHTML=`<style>@page{size:${sz.w}mm ${sz.h}mm;margin:0}#print .lab{page-break-after:always}</style>`+labs.map(p=>labelHTML(p,sz)).join('');
    drawBarcodes(pr,sz);setTimeout(()=>{try{window.print()}catch(e){toast('الطباعة غير متاحة هنا','err')}},80)};
}
