<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>طلبات الصيدليات — ميزان</title>
<link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/theme.css?v=4">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--display);min-height:100dvh;padding-bottom:98px}
button,input{font:inherit;color:inherit}

/* ---------- header: ledger-green brand bar ---------- */
.top{position:sticky;top:0;z-index:30;background:linear-gradient(180deg,var(--side2),var(--side));color:var(--side-ink);
  display:flex;align-items:center;gap:12px;padding:11px 16px calc(11px);box-shadow:var(--sh2)}
.top .mark{flex:none;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--brass-hi),var(--brass) 55%,#9C7430);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 16px -6px rgba(196,154,76,.6)}
.top .mark svg{width:24px;height:24px;color:#1E1606}
.top .brandbox{display:flex;flex-direction:column;line-height:1.1}
.top .brandbox b{font:700 22px/1 var(--brandfont);color:#fff}
.top .brandbox small{color:var(--side-muted);font-size:11.5px;margin-top:3px}
.top .sp{flex:1}
.top .me{text-align:end;line-height:1.2;min-width:0;max-width:46vw}
.top .me b{display:block;font-size:14px;font-weight:600;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .me small{color:var(--brass-hi);font-size:11.5px}
.top button#out{background:rgba(255,255,255,.06);border:1px solid var(--side-muted);color:var(--side-ink);
  border-radius:9px;padding:7px 13px;cursor:pointer;flex:none}
.top button#out:hover{background:rgba(255,255,255,.12)}

.wrap{max-width:900px;margin:0 auto;padding:16px}

/* ---------- welcome / context strip ---------- */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh1);
  padding:16px 18px;margin-bottom:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hero .hi{flex:1;min-width:200px}
.hero .hgreet{font-size:18px;font-weight:700}
.hero .hgreet b{color:var(--brand-ink)}
.hero .hsub{color:var(--muted);font-size:13.5px;margin-top:3px}
.hero .hbadges{display:flex;gap:10px;flex-wrap:wrap}
.badge{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 14px;text-align:center;line-height:1.25}
.badge .bl{display:block;font-size:11px;color:var(--muted)}
.badge b{font-size:14px;color:var(--brand-ink)}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:thin}
.tab{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
.tab.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.tab .num,.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--sh1);overflow:hidden}

/* ---------- search ---------- */
.find{position:relative;margin-bottom:14px}
.find .ic{position:absolute;inset-inline-start:15px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.find input{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;
  padding:15px 46px 15px 16px;outline:0;box-shadow:var(--sh1);transition:border-color .15s,box-shadow .15s}
.find input:focus{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.sugg{position:absolute;inset-inline:0;top:calc(100% + 8px);z-index:20;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--sh2);max-height:360px;overflow:auto}
.sugg button{display:flex;width:100%;gap:12px;align-items:center;text-align:start;background:none;border:0;
  border-bottom:1px solid var(--line2);padding:12px 14px;cursor:pointer}
.sugg button:last-child{border-bottom:0}
.sugg button.on,.sugg button:hover{background:var(--brand-soft)}
.sugg .nm{flex:1;min-width:0;font-weight:600}
.sugg .pr{flex:none;text-align:end;display:flex;flex-direction:column;gap:1px}
.sugg .pr b{font-size:15.5px;color:var(--brand-ink)}
.sugg .pr .cons{font-size:11.5px;color:var(--muted)}
.sugg .av{flex:none;font-size:11px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:3px 9px;white-space:nowrap}
.sugg .av.low{color:var(--danger);border-color:var(--danger);background:var(--danger-soft)}
.sugg .plus{flex:none;width:28px;height:28px;border-radius:9px;background:var(--brand-soft);color:var(--brand-ink);
  display:grid;place-items:center;font-size:16px;font-weight:700}
.av2{display:block;font-size:12px;color:var(--muted);margin-top:3px;font-weight:400}
.av2 b{color:var(--brand-ink)}
.av2.low b{color:var(--danger)}
.none{padding:16px;color:var(--muted);text-align:center}

/* ---------- order table ---------- */
table{width:100%;border-collapse:collapse}
th{background:var(--surface2);color:var(--muted);font-size:12.5px;font-weight:600;text-align:start;padding:10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
th.n,td.n{text-align:end}
td.idx{color:var(--muted);width:34px}
td.nm{font-weight:600}
tr.bad td{background:var(--danger-soft)}
tr.bad .why{display:block;color:var(--danger);font-size:12px;font-weight:600;margin-top:2px}
.cons{color:var(--muted)}
.price b{color:var(--brand-ink)}
.qwrap{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2)}
.qwrap .qty{width:50px;border:0;background:transparent;text-align:center;padding:8px 2px;direction:ltr;outline:0}
.step{border:0;background:transparent;color:var(--brand-ink);font-size:19px;font-weight:700;width:34px;padding:7px 0;cursor:pointer;line-height:1}
.step:active{background:var(--brand-soft)}
.x{background:none;border:0;color:var(--danger);cursor:pointer;font-size:20px;line-height:1;padding:6px 8px;border-radius:8px}
.x:hover{background:var(--danger-soft)}

.empty{padding:40px 18px;text-align:center;color:var(--muted)}
.empty svg{width:52px;height:52px;color:var(--line);margin-bottom:10px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* ---------- sticky total bar ---------- */
.foot{position:fixed;inset-inline:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  box-shadow:0 -6px 20px rgba(10,36,32,.1);padding:11px 16px calc(11px + env(safe-area-inset-bottom))}
.foot>div{max-width:868px;margin:0 auto;display:flex;align-items:center;gap:14px}
.foot .t{flex:1;min-width:0;font-size:12.5px;color:var(--muted)}
.foot .t b{display:block;font-size:22px;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:12px;background:linear-gradient(180deg,var(--btn1),var(--btn2));color:#fff;font-weight:700;
  padding:13px 30px;cursor:pointer;box-shadow:0 8px 18px -8px rgba(13,122,96,.6)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.btn.o{background:var(--surface);color:var(--ink);border:1px solid var(--line);box-shadow:none}

.toast{position:fixed;top:14px;inset-inline:16px;margin:auto;max-width:520px;z-index:60;background:var(--side);color:var(--side-ink);border-radius:12px;padding:12px 14px;text-align:center;box-shadow:var(--sh2)}
.toast.err{background:var(--danger);color:#fff}
.ov{position:fixed;inset:0;z-index:50;background:rgba(6,24,20,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{width:min(440px,100%);background:var(--surface);border-radius:var(--r-l);padding:22px;box-shadow:var(--sh3)}
.dlg h2{margin:0 0 8px;font-size:19px}
.dlg p{margin:0 0 18px;color:var(--muted)}
.dlg .row{display:flex;gap:8px;justify-content:flex-end}

.done{padding:30px 20px;text-align:center}
.done .chk{width:60px;height:60px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 12px}
.done .chk svg{width:32px;height:32px}
.done h2{margin:0 0 6px;font-size:21px}
.done>p{margin:0;color:var(--muted)}
.done ul{list-style:none;margin:18px 0;padding:0;text-align:start}
.done li{display:flex;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line2)}
.done li:last-child{border-bottom:0}
.msg{padding:44px 18px;text-align:center}
.msg b{font-size:17px}

@media(max-width:640px){
  .wrap{padding:12px}
  thead{display:none}
  table,tbody,tr,td{display:block;width:100%}
  tr{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;padding:12px;border-bottom:1px solid var(--line2);align-items:center}
  tr:last-child{border-bottom:0}
  td{padding:0;border:0}
  td.idx{display:none}
  td.nm{grid-column:1/3;font-weight:700}
  td.rm{grid-column:3;grid-row:1;text-align:end}
  td.c,td.p,td.s{text-align:start}
  td.c::before,td.p::before,td.s::before{content:attr(data-l);display:block;font-size:12px;color:var(--muted)}
  td.q{grid-column:3;grid-row:2/4;text-align:end}
  td.c{grid-column:1;grid-row:2}td.p{grid-column:2;grid-row:2}td.s{grid-column:1/3;grid-row:3;font-weight:700}
}
</style>
</head>
<body>
<header class="top">
  <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.2v17.6M7.5 20.8h9M12 6l-7 1.6 7-1.6 7-1.6L12 6Z"/><path d="M5 7.6 2.4 13a2.6 2.6 0 0 0 5.2 0L5 7.6ZM19 7.6 16.4 13a2.6 2.6 0 0 0 5.2 0L19 7.6Z"/></svg></span>
  <div class="brandbox"><b>ميزان</b><small>طلبات الصيدليات</small></div>
  <span class="sp"></span>
  <div class="me"><b id="who">…</b><small id="meTier"></small></div>
  <button id="out" type="button">خروج</button>
</header>
<div class="wrap" id="view"><div class="msg">جارٍ التحميل…</div></div>
<div class="foot" id="foot" hidden><div><div class="t"><span id="fl"></span><b class="num" id="ft">0</b></div><button class="btn" id="save" type="button">حفظ الأوردر</button></div></div>
<script src="/vendor/barcode/polyfill.js"></script>
<script>
(function(){'use strict';
const H={'Content-Type':'application/json','X-Mizan':'1'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const rid=()=>{const a=new Uint8Array(16);crypto.getRandomValues(a);return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')};
let ME=null,MAX=10,INV=[{lines:[]}],cur=0,KEY=rid(),busy=false,done=null;
let hits=[],at=0,lastQ='',timer=null,seq=0;

async function api(url,opts){
  let r;try{r=await fetch(url,Object.assign({credentials:'same-origin'},opts||{}))}catch(e){throw Object.assign(new Error('السيرفر مش بيرد — استنى دقيقة وحاول تاني'),{net:1})}
  if(r.status===401){location.href='/login';throw new Error('login')}
  if(r.status>=502&&r.status<=504)throw Object.assign(new Error('السيرفر بيصحى — استنى دقيقة وحاول تاني'),{net:1});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(j.error||'حصلت مشكلة — حاول تاني'),{body:j});
  return j}
let toastT=null;function toast(m,bad){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.className='toast'+(bad?' err':'');t.textContent=m;t.setAttribute('role','alert');clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),bad?5000:2800)}

/* المسودة بتفضل لو الصفحة اتقفلت أو النت قطع */
const DK=()=>'mz.shop.'+(ME&&ME.name||'');
function saveDraft(){try{localStorage.setItem(DK(),JSON.stringify({INV,cur}))}catch(e){}}
function loadDraft(){try{const d=JSON.parse(localStorage.getItem(DK())||'null');if(d&&Array.isArray(d.INV)&&d.INV.length){INV=d.INV;cur=Math.min(+d.cur||0,INV.length-1)}}catch(e){}}
function clearDraft(){try{localStorage.removeItem(DK())}catch(e){}}
function touched(){KEY=rid();saveDraft();paintFoot()}

const lineTotal=l=>(+l.qty||0)*(+l.price||0);
const invTotal=i=>i.lines.reduce((s,l)=>s+lineTotal(l),0);
const filled=()=>INV.filter(i=>i.lines.length);

const SEARCH_IC='<svg class="ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>';

function heroHTML(){
  return `<div class="hero">
    <div class="hi"><div class="hgreet">أهلاً، <b>${esc(ME.name)}</b></div>
      <div class="hsub">اختار أصنافك واكتب الكميات، واحفظ الأوردر — والشركة تراجعه وتجهّزه لك.</div></div>
    <div class="hbadges">
      ${ME.tier?`<span class="badge"><span class="bl">شريحة الأسعار</span><b>${esc(ME.tier)}</b></span>`:''}
      <span class="badge"><span class="bl">السداد</span><b>${ME.days?('آجل '+ME.days+' يوم'):'نقدي'}</b></span>
    </div></div>`;
}

function view(){
  if(done)return viewDone();
  $('#view').innerHTML=`${heroHTML()}
  ${INV.length>1?`<div class="tabs" role="tablist">${INV.map((x,i)=>`<button class="tab ${i===cur?'on':''}" data-tab="${i}" role="tab" type="button">فاتورة ${i+1} · <span class="num">${x.lines.length}/${MAX}</span></button>`).join('')}</div>`:''}
  <div class="find">${SEARCH_IC}<input id="ps" placeholder="اكتب اسم الصنف أو امسح الباركود" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="بحث عن صنف"><div class="sugg" id="sg" hidden></div></div>
  <div class="card" id="tb"></div>`;
  $('#view').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{cur=+b.dataset.tab;saveDraft();view();$('#ps').focus()});
  paintLines();bindSearch();paintFoot()}

function paintLines(){
  const inv=INV[cur];const el=$('#tb');
  if(!inv.lines.length){el.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 12.4a1.6 1.6 0 0 0 1.6 1.3h8.4a1.6 1.6 0 0 0 1.6-1.3L22 8H6"/><circle cx="9" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg><b>أوردرك لسه فاضي</b>ابدأ بإضافة أول صنف من خانة البحث فوق</div>`;return}
  el.innerHTML=`<table><thead><tr><th>#</th><th>الصنف</th><th class="n">سعر المستهلك</th><th class="n">سعرك</th><th class="n">الكمية</th><th class="n">الإجمالي</th><th></th></tr></thead><tbody>
  ${inv.lines.map((l,i)=>`<tr class="${l.bad?'bad':''}"><td class="idx num">${i+1}</td><td class="nm">${esc(l.name)}${l.avail!=null?`<span class="av2${l.avail<=5?' low':''}">المتاح <b class="num">${l.avail}</b></span>`:''}${l.bad?`<span class="why">${esc(l.bad)}</span>`:''}</td>
   <td class="n c cons" data-l="سعر المستهلك"><span class="num">${money(l.consumer)}</span></td><td class="n p price" data-l="سعرك"><b class="num">${money(l.price)}</b></td>
   <td class="n q"><div class="qwrap"><button class="step" type="button" data-step="-1" data-i="${i}" aria-label="أنقص">−</button><input class="qty" data-q="${i}" inputmode="numeric" value="${esc(l.qty)}" aria-label="الكمية"><button class="step" type="button" data-step="1" data-i="${i}" aria-label="زوّد">+</button></div></td>
   <td class="n s" data-l="الإجمالي"><span class="num" data-s="${i}">${money(lineTotal(l))}</span></td>
   <td class="rm"><button class="x" data-x="${i}" type="button" aria-label="حذف الصنف">×</button></td></tr>`).join('')}</tbody></table>`;
  const refresh=(i)=>{const l=INV[cur].lines[i];const s=el.querySelector(`[data-s="${i}"]`);if(s)s.textContent=money(lineTotal(l));touched()};
  el.querySelectorAll('[data-q]').forEach(q=>{const i=+q.dataset.q;
    q.oninput=()=>{const v=String(q.value).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'');const l=INV[cur].lines[i];let nv=v===''?'':+v;if(nv!==''&&l.avail!=null&&nv>l.avail){nv=l.avail;toast('المتاح '+l.avail+' قطعة بس',true)}q.value=nv===''?'':nv;l.qty=nv;delete l.bad;q.closest('tr').classList.remove('bad');refresh(i)};
    q.onfocus=()=>q.select();
    q.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('#ps').focus()}}});
  el.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,d=+b.dataset.step;const l=INV[cur].lines[i];
    let nv=Math.max(1,(+l.qty||0)+d);if(d>0&&l.avail!=null&&nv>l.avail){nv=l.avail;toast('المتاح '+l.avail+' قطعة بس',true)}l.qty=nv;delete l.bad;const q=el.querySelector(`[data-q="${i}"]`);if(q)q.value=l.qty;b.closest('tr').classList.remove('bad');refresh(i)});
  el.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{INV[cur].lines.splice(+b.dataset.x,1);
    if(!INV[cur].lines.length&&INV.length>1){INV.splice(cur,1);cur=Math.min(cur,INV.length-1);touched();view();return}
    touched();paintLines();paintTabs()})}

function paintTabs(){document.querySelectorAll('[data-tab]').forEach((b,i)=>{const s=b.querySelector('.num');if(s&&INV[i])s.textContent=INV[i].lines.length+'/'+MAX})}
function paintFoot(){const f=$('#foot');const n=filled();f.hidden=!!done||!n.length;$('#fl').textContent=n.length>1?`إجمالي ${n.length} فواتير`:'إجمالي الأوردر';$('#ft').textContent=money(n.reduce((s,i)=>s+invTotal(i),0));const b=$('#save');b.textContent=n.length>1?'حفظ الفواتير':'حفظ الأوردر';b.disabled=busy}

function add(it){
  if(it.avail!=null&&!(it.avail>=1)){toast('مفيش كمية متاحة من الصنف ده دلوقتي',true);return}
  for(let i=0;i<INV.length;i++){const k=INV[i].lines.findIndex(l=>l.pid===it.id);if(k>=0){if(i!==cur){cur=i;view()}const q=document.querySelector(`[data-q="${k}"]`);if(q){q.focus()}toast('الصنف موجود في الأوردر — عدّل كميته');return}}
  let moved=false;
  if(INV[cur].lines.length>=MAX){let t=INV.findIndex(x=>x.lines.length<MAX);if(t<0){INV.push({lines:[]});t=INV.length-1}cur=t;moved=true}
  INV[cur].lines.push({pid:it.id,name:it.name,consumer:it.consumer,price:it.price,avail:it.avail,qty:1});
  touched();
  if(moved){view();toast(`الفاتورة كملت ${MAX} أصناف — الصنف نزل في فاتورة ${cur+1}`)}else{const hadTabs=!!document.querySelector('.tabs');if(hadTabs)paintTabs();paintLines();$('#ps').value=''}
  closeSg();const q=document.querySelector(`[data-q="${INV[cur].lines.length-1}"]`);if(q){q.focus()}}

function closeSg(){const s=$('#sg');if(s)s.hidden=true;hits=[];at=0}
function paintSg(){const s=$('#sg');if(!s)return;
  if(!hits.length){s.innerHTML='<div class="none">مفيش صنف متاح بالاسم ده</div>';s.hidden=false;return}
  s.innerHTML=hits.map((h,i)=>`<button type="button" class="${i===at?'on':''}" data-h="${i}"><span class="nm">${esc(h.name)}</span><span class="pr"><b class="num">${money(h.price)}</b><span class="num cons">مستهلك ${money(h.consumer)}</span></span><span class="av num${h.avail<=5?' low':''}">متاح ${h.avail}</span><span class="plus" aria-hidden="true">＋</span></button>`).join('');
  s.hidden=false;s.querySelectorAll('[data-h]').forEach(b=>b.onmousedown=e=>{e.preventDefault();add(hits[+b.dataset.h])})}
async function find(q,exact){const n=++seq;const j=await api('/api/shop/search?q='+encodeURIComponent(q)+(exact?'&exact=1':''));return n===seq?j.items:null}
function bindSearch(){const p=$('#ps');
  p.oninput=()=>{const q=p.value.trim();clearTimeout(timer);if(!q){seq++;closeSg();return}timer=setTimeout(async()=>{try{const r=await find(q);if(r&&p.value.trim()===q){hits=r;at=0;lastQ=q;paintSg()}}catch(e){toast(e.message,true)}},180)};
  p.onkeydown=async e=>{
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(!hits.length)return;e.preventDefault();at=(at+(e.key==='ArrowDown'?1:-1)+hits.length)%hits.length;paintSg();return}
    if(e.key==='Escape'){closeSg();return}
    if(e.key!=='Enter')return;e.preventDefault();const q=p.value.trim();if(!q)return;clearTimeout(timer);
    if(hits.length&&lastQ===q){add(hits[at]);return}
    try{const ex=await find(q,true);if(ex&&ex.length===1){add(ex[0]);return}const r=await find(q);if(r){hits=r;at=0;lastQ=q;if(r.length===1)add(r[0]);else paintSg()}}catch(err){toast(err.message,true)}};
  p.onblur=()=>setTimeout(closeSg,150)}

function ask(n,total){return new Promise(res=>{const d=document.createElement('div');d.className='ov';
  d.innerHTML=`<div class="dlg" role="dialog" aria-modal="true"><h2>تأكيد الحفظ</h2><p>${n>1?`هيتحفظ ${n} فواتير`:'هيتحفظ الأوردر'} بإجمالي <b class="num">${money(total)}</b>، ومش هتقدر تعدّله بعد الحفظ.</p><div class="row"><button class="btn o" id="dNo" type="button">رجوع</button><button class="btn" id="dOk" type="button">تأكيد الحفظ</button></div></div>`;
  document.body.appendChild(d);const end=v=>{d.remove();res(v)};d.querySelector('#dNo').onclick=()=>end(false);d.querySelector('#dOk').onclick=()=>end(true);d.querySelector('#dOk').focus()})}

function mark(pid,msg){INV.forEach(i=>i.lines.forEach(l=>{if(l.pid===pid)l.bad=msg}))}
async function save(){
  if(busy)return;const list=filled();if(!list.length)return;
  const badQ=list.find(i=>i.lines.some(l=>!(+l.qty>=1)));
  if(badQ){cur=INV.indexOf(badQ);view();toast('اكتب كمية لكل صنف',true);return}
  if(!(await ask(list.length,list.reduce((s,i)=>s+invTotal(i),0))))return;
  busy=true;paintFoot();$('#save').textContent='جارٍ الحفظ…';
  try{
    const j=await api('/api/shop/invoices',{method:'POST',headers:H,body:JSON.stringify({key:KEY,invoices:list.map(i=>({lines:i.lines.map(l=>({pid:l.pid,qty:+l.qty,price:l.price}))}))})});
    done=j.invoices;clearDraft();INV=[{lines:[]}];cur=0;KEY=rid();view();
  }catch(e){
    const b=e.body||{};let moved=false;
    (b.gone||[]).forEach(x=>{mark(x.pid,'الكمية دي مش متاحة — قللها أو احذف الصنف');moved=true});
    (b.changed||[]).forEach(x=>{INV.forEach(i=>i.lines.forEach(l=>{if(l.pid===x.pid){l.price=x.price;l.consumer=x.consumer;l.bad='السعر اتغير — راجعه'}}));moved=true});
    if(moved){const t=INV.findIndex(i=>i.lines.some(l=>l.bad));if(t>=0)cur=t;KEY=rid();saveDraft();view()}
    toast(e.message,true)
  }finally{busy=false;paintFoot()}}

function viewDone(){const s=done.reduce((a,x)=>a+x.total,0);
  $('#view').innerHTML=`<div class="card"><div class="done"><div class="chk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg></div>
  <h2>تم إرسال الأوردر ✓</h2><p>الشركة هتراجع ${done.length>1?'الفواتير':'الفاتورة'} وتجهّزها لك.</p>
  <ul>${done.map(x=>`<li><span>فاتورة رقم <b class="num">${esc(x.no)}</b> · ${esc(x.lines)} صنف</span><b class="num">${money(x.total)}</b></li>`).join('')}${done.length>1?`<li><b>الإجمالي</b><b class="num">${money(s)}</b></li>`:''}</ul>
  <button class="btn" id="again" type="button">أوردر جديد</button></div></div>`;
  $('#again').onclick=()=>{done=null;view();$('#ps').focus()};paintFoot()}

$('#out').onclick=async()=>{try{await fetch('/api/logout',{method:'POST',credentials:'same-origin',headers:H})}catch(e){}location.href='/login'};
$('#save').onclick=save;
(async function boot(){
  try{ME=await api('/api/shop/me')}catch(e){$('#view').innerHTML=`<div class="card msg"><p>${esc(e.message)}</p><button class="btn" type="button" onclick="location.reload()">حاول تاني</button></div>`;return}
  MAX=ME.maxLines||10;$('#who').textContent=ME.name;
  $('#meTier').textContent=ME.ready?(ME.tier?('شريحة '+ME.tier):'')+(ME.days?(ME.tier?' · ':'')+'آجل '+ME.days+' يوم':''):'';
  if(!ME.ready){$('#view').innerHTML='<div class="card msg"><b>حسابك لسه مش جاهز للشراء</b><p style="color:var(--muted)">كلم الشركة علشان تحدد لك شريحة الأسعار.</p></div>';return}
  loadDraft();view();$('#ps').focus();
  const s=document.createElement('script');s.src='/scan.js?v=1';document.body.appendChild(s);
})();
})();
</script>
